rules:
- id: generic-api-key
  name: Generic API Key Assignment
  category: generic
  severity: medium
  confidence: medium
  pattern: \b(?:api[_-]?key|client[_-]?secret|access[_-]?token)\s*[:=]\s*["\'][A-Za-z0-9_-]{16,}["\']
  keywords:
  - api
  - token
  - secret
  allowlist:
  - example
  - changeme
  - your_api_key
  - replace_me
- id: jwt-like-token
  name: JWT-like Token
  category: token
  severity: high
  confidence: medium
  pattern: \beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b
  keywords:
  - eyj
- id: generic-access-token
  name: Generic Bearer Token
  category: token
  severity: medium
  confidence: medium
  pattern: Bearer\s+[A-Za-z0-9._-]{20,}
  keywords:
  - bearer
