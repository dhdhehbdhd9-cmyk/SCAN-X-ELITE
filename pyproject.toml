[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-x-elite"
version = "0.2.0"
description = "Local-first secret discovery and Git exposure analysis"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
scanx = "scanx_app.cli:main"

[tool.setuptools.packages.find]
include = ["scanx_app*"]
